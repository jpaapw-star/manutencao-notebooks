# Envia src/ para o Apps Script e atualiza o app da Web sempre que a branch main muda.
# Também manda as anotações de notas/ para o app sempre que elas mudam (em qualquer branch).
# Configuração única: segredo CLASPRC_JSON (o mesmo dos outros apps). Opcional: GEMINI_API_KEY (a mesma do SCAN) liga a IA da etiqueta.
name: Apps Script

on:
  push:
  workflow_dispatch:

concurrency:
  group: apps-script-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Medir a IA nas fotos de etiqueta
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/medir-ia.js | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Conferir se o app abre sem login
        continue-on-error: true
        run: |
          URL="https://script.google.com/macros/s/AKfycbyJartOZ2D2KeLQ_IFelaF1pemHf1Xun0MlglVAE9UDTeQM8e847r32Yxfis3VL5BClsg/exec"
          curl -sL -A "Mozilla/5.0 (Linux; Android 14) Mobile" -o pagina.html -w "HTTP %{http_code} | final: %{url_effective}\n" "$URL" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -o '<title>[^<]*</title>' pagina.html | head -1 | tee -a "$GITHUB_STEP_SUMMARY"
          grep -o 'Não foi possível abrir o arquivo\|unable to open the file\|Manutenção' pagina.html | sort | uniq -c | tee -a "$GITHUB_STEP_SUMMARY"
          echo "POST do site (CORS):"
          curl -sL -D - -o resposta.json -H "Origin: https://jpaapw-star.github.io" -H "Content-Type: text/plain;charset=utf-8" --data '{"api":"apiIaLigada","args":[]}' "$URL" | grep -i "^HTTP\|access-control-allow-origin\|^content-type" | tee -a "$GITHUB_STEP_SUMMARY"
          head -c 300 resposta.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo; echo "IA pelo site (foto vazia, só para ver se a IA tem permissão):"
          curl -sL -H "Content-Type: text/plain;charset=utf-8" --data '{"api":"apiLerComIA","args":["",{}]}' "$URL" | head -c 400 | tee -a "$GITHUB_STEP_SUMMARY"
          # Fotos reais pela IA do app publicado: só fora da main (na main o app ainda é o antigo nesta hora).
          [ "$GITHUB_REF" = "refs/heads/main" ] && exit 0
          for f in tests/etiquetas/*.jpg; do
            echo; echo "Etiqueta $f:"
            node -e 'const fs=require("fs");process.stdout.write(JSON.stringify({api:"apiLerComIA",args:["data:image/jpeg;base64,"+fs.readFileSync(process.argv[1]).toString("base64"),{}]}))' "$f" > corpo.json
            curl -sL -H "Content-Type: text/plain;charset=utf-8" --data @corpo.json "$URL" | head -c 600 | tee -a "$GITHUB_STEP_SUMMARY"
          done

  enviar:
    needs: testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Falta o segredo CLASPRC_JSON (veja docs/INSTALACAO.md)."; exit 1; fi
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          CHAVE=$(printf 'notas:%s' "$CLASPRC_JSON" | sha256sum | cut -c1-40)
          CHAVE="$CHAVE" node -e 'const s={notasChave:process.env.CHAVE};const g=(process.env.GEMINI_API_KEY||"").trim();if(g)s.iaChave=g;require("fs").writeFileSync("src/00_Segredos.gs","var SEGREDOS = "+JSON.stringify(s)+";\n")'
      - name: Criar o projeto do Apps Script (só na primeira vez)
        run: |
          if [ ! -f .clasp.json ]; then
            clasp create --type standalone --title "Manutenção de notebooks" --rootDir src
            [ -f .clasp.json ] || mv src/.clasp.json .clasp.json
            node -e 'const f=".clasp.json";const c=JSON.parse(require("fs").readFileSync(f));require("fs").writeFileSync(f,JSON.stringify({scriptId:c.scriptId,rootDir:"src"},null,2)+"\n")'
            git checkout -- src/appsscript.json 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .clasp.json
            git commit -m "Liga o repositório ao projeto do Apps Script criado"
            git push
          fi
          cat .clasp.json
      - name: Enviar código
        run: clasp push --force
      - name: Atualizar o app da Web
        run: |
          DEP=$(clasp deployments | grep -v '@HEAD' | grep -o 'AKfyc[A-Za-z0-9_-]*' | head -1 || true)
          if [ -n "$DEP" ]; then
            clasp deploy --deploymentId "$DEP" --description "GitHub ${GITHUB_SHA::7}"
          else
            clasp deploy --description "GitHub ${GITHUB_SHA::7}"
            DEP=$(clasp deployments | grep -v '@HEAD' | grep -o 'AKfyc[A-Za-z0-9_-]*' | head -1 || true)
          fi
          echo "App da Web: https://script.google.com/macros/s/$DEP/exec" | tee -a "$GITHUB_STEP_SUMMARY"
          # Site próprio do app (GitHub Pages): a mesma tela, falando com o app sem cookies.
          mkdir -p site
          sed "s#<!--SITE-->#<title>Manutenção</title><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><script>window.API_URL='https://script.google.com/macros/s/$DEP/exec';</script>#" src/Index.html > site/index.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Apagar credenciais
        if: always()
        run: rm -f ~/.clasprc.json src/00_Segredos.gs

  site:
    needs: enviar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - id: publicar
        uses: actions/deploy-pages@v4
      - name: Mostrar o endereço
        run: echo "Site do app - ${{ steps.publicar.outputs.page_url }}" | tee -a "$GITHUB_STEP_SUMMARY"

  notas:
    needs: [testes, enviar]
    if: always() && needs.testes.result == 'success' && (needs.enviar.result == 'success' || needs.enviar.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ver se as anotações mudaram
        id: mudou
        env:
          ANTES: ${{ github.event.before }}
        run: |
          # Compara com o que havia antes do push (vários commits de uma vez contam todos).
          # Branch nova: compara com a main.
          if echo "$ANTES" | grep -q '^0*$' || ! git cat-file -e "$ANTES" 2>/dev/null; then ANTES=$(git merge-base HEAD origin/main 2>/dev/null || echo HEAD~1); fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only "$ANTES" HEAD 2>/dev/null | grep -q '^notas/'; then
            echo "sim=1" >> "$GITHUB_OUTPUT"
          else
            echo "Anotações sem mudança."
          fi
      - uses: actions/setup-node@v4
        if: steps.mudou.outputs.sim == '1'
        with:
          node-version: 22
      - name: Mandar anotações para o app
        if: steps.mudou.outputs.sim == '1'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ ! -f .clasp.json ]; then
            git fetch --depth 1 origin main && git checkout origin/main -- .clasp.json 2>/dev/null || true
          fi
          if [ -z "$CLASPRC_JSON" ] || [ ! -f .clasp.json ]; then echo "::warning::App ainda não instalado."; exit 0; fi
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          DEP=$(clasp deployments | grep -v '@HEAD' | grep -o 'AKfyc[A-Za-z0-9_-]*' | head -1 || true)
          CHAVE=$(printf 'notas:%s' "$CLASPRC_JSON" | sha256sum | cut -c1-40)
          rm -f ~/.clasprc.json
          if [ -z "$DEP" ]; then echo "::warning::App da Web ainda não publicado."; exit 0; fi
          node scripts/enviar-notas.js "https://script.google.com/macros/s/$DEP/exec" "$CHAVE"
